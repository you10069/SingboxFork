name: Deploy sing-box 1.11.15 Documentation

# 只允许手动运行
# 不会因为提交、修改文档或同步 Fork 自动触发
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止同时运行多个 Pages 部署任务
concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      # 读取你手动运行时选择的分支
      - name: Checkout repository
        uses: actions/checkout@v6

      # MkDocs 使用 Python 运行
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 获取当前仓库对应的 GitHub Pages 地址
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # 安装 sing-box 1.11.15 文档所需组件
      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mkdocs-material==9.*" \
            "mkdocs-static-i18n==1.2.*"

      # 准备专用于你自己 GitHub Pages 的配置
      - name: Prepare Pages configuration
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          # sing-box 原仓库中的 CNAME 指向官方文档域名：
          # sing-box.sagernet.org
          #
          # 这里只删除 Actions 临时工作目录中的副本，
          # 不会删除你 GitHub 仓库中的 docs/CNAME。
          rm -f docs/CNAME

          # 复制一份临时 MkDocs 配置，
          # 避免直接修改仓库原有的 mkdocs.yml。
          cp mkdocs.yml mkdocs.pages.yml

          # 去掉 Pages 地址末尾可能已有的斜杠，
          # 再统一补上一个斜杠。
          PAGES_BASE_URL="${PAGES_BASE_URL%/}"

          # 设置你的 GitHub Pages 站点地址。
          printf '\nsite_url: "%s/"\n' \
            "${PAGES_BASE_URL}" \
            >> mkdocs.pages.yml

          # 将页面中的仓库链接从官方仓库改成你的 Fork。
          sed -i \
            "s|^repo_url:.*|repo_url: https://github.com/${GITHUB_REPOSITORY}|" \
            mkdocs.pages.yml

          sed -i \
            "s|^repo_name:.*|repo_name: ${GITHUB_REPOSITORY}|" \
            mkdocs.pages.yml

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Pages URL: ${PAGES_BASE_URL}/"

      # 将 Markdown 文档生成静态网页
      - name: Build MkDocs site
        run: |
          mkdocs build \
            --clean \
            --config-file mkdocs.pages.yml \
            --site-dir site

      # 上传生成的网站文件，供部署任务使用
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 将上一步生成的网站发布到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
