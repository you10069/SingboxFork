name: Providers backport check

on:
  workflow_dispatch:
  push:
    paths:
      - "adapter/provider.go"
      - "adapter/provider/**"
      - "adapter/outbound/manager.go"
      - "box.go"
      - "constant/provider.go"
      - "experimental/cachefile/**"
      - "experimental/clashapi/**"
      - "include/registry.go"
      - "option/group.go"
      - "option/options.go"
      - "option/provider.go"
      - "protocol/group/**"
      - "provider/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/providers-backport-check.yml"
  pull_request:
    paths:
      - "adapter/provider.go"
      - "adapter/provider/**"
      - "adapter/outbound/manager.go"
      - "box.go"
      - "constant/provider.go"
      - "experimental/cachefile/**"
      - "experimental/clashapi/**"
      - "include/registry.go"
      - "option/group.go"
      - "option/options.go"
      - "option/provider.go"
      - "protocol/group/**"
      - "provider/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/providers-backport-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Provider option, parser and adapter tests
        run: |
          go test ./option ./provider/parser ./adapter/provider

      - name: Compile Provider integration packages
        run: |
          go test -run '^$' -tags 'with_utls,with_reality_server,with_clash_api' \
            ./provider/local \
            ./provider/remote \
            ./protocol/group \
            ./experimental/cachefile \
            ./experimental/clashapi

      - name: Build full command-line binary
        run: |
          CGO_ENABLED=0 go build \
            -trimpath \
            -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_reality_server,with_acme,with_clash_api,with_ech' \
            -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.11.15-utls-providers.2 -s -w -buildid=' \
            -o sing-box \
            ./cmd/sing-box

      - name: Verify Provider configuration decoding
        run: |
          cat > provider-check.json <<'JSON'
          {
            "providers": [
              {
                "type": "inline",
                "tag": "demo",
                "outbounds": [
                  {
                    "type": "socks",
                    "tag": "node",
                    "server": "127.0.0.1",
                    "server_port": 1080
                  }
                ]
              }
            ],
            "outbounds": [
              {
                "type": "selector",
                "tag": "select",
                "providers": ["demo"]
              }
            ],
            "route": {
              "final": "select"
            }
          }
          JSON
          ./sing-box check -c provider-check.json
