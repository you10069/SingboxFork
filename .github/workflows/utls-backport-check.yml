name: uTLS backport check

on:
  workflow_dispatch:
  push:
    paths:
      - "common/tls/**"
      - "common/badtls/**"
      - "go.mod"
      - "go.sum"
      - "test/go.mod"
      - "test/go.sum"
      - ".github/workflows/utls-backport-check.yml"
  pull_request:
    paths:
      - "common/tls/**"
      - "common/badtls/**"
      - "go.mod"
      - "go.sum"
      - "test/go.mod"
      - "test/go.sum"
      - ".github/workflows/utls-backport-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.2"
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Compile TLS and badtls packages
        run: |
          go test -run '^$' -tags 'with_utls,with_reality_server' ./common/tls ./common/badtls

      - name: Run REALITY Session ID regression test
        run: |
          go test -run '^TestRealityClientConfigDoesNotExposeSessionIDGenerator$' -tags 'with_utls' ./common/tls

      - name: Build full command-line binary
        run: |
          CGO_ENABLED=0 go build \
            -trimpath \
            -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_reality_server,with_acme,with_clash_api,with_ech' \
            -ldflags '-X github.com/sagernet/sing-box/constant.Version=1.11.15-utls.1 -s -w -buildid=' \
            -o sing-box \
            ./cmd/sing-box

      - name: Audit embedded dependency metadata
        run: |
          go version -m ./sing-box | tee build-info.txt
          grep -F 'github.com/metacubex/utls' build-info.txt
          grep -F 'github.com/sagernet/sing-vmess' build-info.txt
          grep -F 'github.com/sagernet/sing-shadowtls' build-info.txt
          if grep -E 'github.com/sagernet/(utls|reality)' build-info.txt; then
            echo 'obsolete uTLS or REALITY module remains embedded' >&2
            exit 1
          fi
